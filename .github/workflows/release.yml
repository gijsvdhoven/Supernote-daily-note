name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          # sn-plugin-lib is a device-side native module that may not be on npm.
          # If it is absent, inject a no-op shim so Metro can resolve the import.
          # The shim is bundled but never runs — the real library executes on-device.
          if [ ! -d node_modules/sn-plugin-lib ]; then
            mkdir -p node_modules/sn-plugin-lib
            cat > node_modules/sn-plugin-lib/index.js <<'JS'
          const noop = () => {};
          const asyncNull = () => Promise.resolve(null);
          const proxy = () => new Proxy({}, { get: () => asyncNull });
          module.exports = {
            PluginManager: {
              init: noop, registerButton: noop, registerButtonListener: noop,
              registerConfigButton: noop, registerConfigButtonListener: noop,
              showPluginView: noop, closePluginView: noop,
            },
            PluginCommAPI: proxy(),
            PluginFileAPI: proxy(),
            PluginNoteAPI: proxy(),
            FileUtils: proxy(),
          };
          JS
            printf '{"name":"sn-plugin-lib","version":"0.0.0","main":"index.js"}\n' \
              > node_modules/sn-plugin-lib/package.json
          fi

      - name: Stamp version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('PluginConfig.json', 'utf8'));
            cfg.pluginVersion = '${VERSION}';
            fs.writeFileSync('PluginConfig.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Bundle JS
        run: |
          mkdir -p build/bundle/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build/bundle/index.android.bundle \
            --assets-dest build/bundle/assets

      - name: Package .snplg
        run: |
          cp PluginConfig.json build/bundle/
          mkdir -p build/outputs
          cd build/bundle && zip -r ../../build/outputs/SupernoteDailyNote.snplg .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/SupernoteDailyNote.snplg
          generate_release_notes: true
